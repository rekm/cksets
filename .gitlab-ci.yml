image: mambaorg/micromamba

stages:
  - sync
  - build
  - test
  - benchmark

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BASE_PYTHON: "3.10"
  BASE_ENVNAME: "base"
  BUILD_ENVNAME: "build_env"


# https://pip.pypa.io/en/stable/topics/caching/
cache:
  key: micromamba-env
  paths:
    - /opt/conda/envs        
    - .cache/pip              

.setup_env:
  before_script:
    - micromamba create --yes python=$BASE_PYTHON -f build_env.yml -n ${BUILD_ENVNAME} || micromamba update --yes python=$BASE_PYTHON -f build_env.yml -n ${BUILD_ENVNAME}
    - eval "$(micromamba shell hook --shell=bash)"
    - micromamba install -y -n ${BUILD_ENVNAME} -c conda-forge git
    - micromamba activate ${BUILD_ENVNAME}

.benchmark_rule_base_cpp:
  rules:
    - if: '$CI_COMMIT_BRANCH == "benchmark"'
      changes:
        - "**/CMakeLists.txt"
        - "cmake/*"
        - "src/**/*"
        - "include/**/*"
        - "python_bindings/**/*"
        - "ksets_cpp/**/*"
        - ".gitlab-ci.yml"

.default_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "integration"'
      changes:
        - "**/CMakeLists.txt"
        - "cmake/*"
        - "src/**/*"
        - "include/**/*"
        - "python_bindings/**/*"
        - "test/**/*"
        - "ksets_cpp/**/*"
        - ".gitlab-ci.yml"
        - "build_env.yml"
        - "pyproject.toml"
      when: always
    - when: never

.sync_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "integration"'
      changes:
        - "**/CMakeLists.txt"
        - "cmake/*"
        - "src/**/*"
        - "include/**/*"
        - "python_bindings/**/*"
        - "test/**/*"
        - "ksets_cpp/**/*"
        - ".gitlab-ci.yml"
        - "build_env.yml"
        - "pyproject.toml"
        - "README.md"
      when: always
    - when: never

sync_to_github:
  stage: sync
  extends:
    - .sync_rules
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client
  script:
    - git remote add github https://rekm:${GH_ACCESS}@github.com/rekm/cksets
    - git push --prune github +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*

py_build:
  stage: build
  extends:
    - .setup_env
    - .default_rules
  script:
    - rm -rf build
    - pip install .
    # run the command here
  artifacts:
    paths:
      - build/*

cpp_build:
  stage: build
  extends:
    - .setup_env
    - .default_rules
  script:
    - cmake  -B c_build  -DCMAKE_CXX_COMPILER=$(which g++) -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - cmake --build c_build  -j 4
  artifacts:
    paths:
      - c_build/*
  


cpp_test:
  stage: test
  extends:
    - .setup_env
    - .default_rules
  needs:
    - cpp_build
  script:
    - cmake --build c_build   -t check -j 5 
  artifacts:
    paths:
      - c_build/*

cpp_base_benchmark:
  stage: benchmark
  extends:
    - .setup_env
    - .benchmark_rule_base_cpp
  needs:
    - cpp_build
  script:
    - mkdir benchmark_results #              $(git rev-parse --short HEAD)
    - ./benchmarks/run_benchmarking  ksets_easy_sim 
    - ./benchmarks/collect_benchmarks.py -i "$CI_COMMIT_SHORT_SHA" -n commit  > ./benchmark_results/benchmark.tsv 
  artifacts:
    paths:
      - benchmark_results/*

  