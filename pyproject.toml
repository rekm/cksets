[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11", 
]
build-backend = "scikit_build_core.build"

[project]
name = "ksets-cpp"
version = "0.2.0"
description = "C++ accelerated K-Sets clustering with pybind11 bindings"
authors = [{ name = "René Kmiecinski" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Source = "https://git.imp.fu-berlin.de/rwk53376/cksets"
Issues = "https://git.imp.fu-berlin.de/rwk53376/cksets/issues"

[project.scripts]
py-ksets = "ksets_cpp.scripts.ksets:main"
py-cksets = "ksets_cpp.scripts.cksets:main"


# ==============================
# scikit-build configuration
# ==============================
[tool.scikit-build]
# Where the python extension target lives
cmake.source-dir = "."

# Cache CMake files for speed
build-dir = "build"

# You already rely on top-level CMakeLists
cmake.minimum-version = "3.25"

# Make sure wheels include native arch tags
wheel.py-api = ""
